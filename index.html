<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ストップウォッチ" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <title>ストップウォッチ</title>
  </head>
  <body>
    <main class="stopwatch-app" aria-label="ストップウォッチ">
      <section class="timer-panel" aria-label="計測操作">
        <output id="stopwatch-readout" class="stopwatch-readout" aria-label="経過時間">00:00:00.00</output>
        <div class="controls" aria-label="ストップウォッチの操作">
          <button id="lap-reset-button" class="control-button secondary" type="button" disabled>ラップ</button>
          <button id="start-stop-button" class="control-button start" type="button">開始</button>
        </div>
      </section>

      <section class="laps-panel" aria-label="ラップタイム">
        <div class="laps-heading"><span>ラップ</span><span>時間</span></div>
        <div id="lap-list" class="lap-list" role="log" aria-live="polite">
          <p class="empty-laps">開始するとラップ 1 の計測が表示されます</p>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
